 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h1 class="text-center text-white bg-info p-2">1st todo crud using generic function,fetch, firebase, promises</h1>

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-md-4 offset-md-1 mb-4">
                <div class="card">
                    <div class="card-header text-white bg-info text-center">
                        <h3>Add Your Todos</h3>
                    </div>

                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="todoInput">Todo Item</label>
                                <input required type="text" id="todoInput" class="form-control">
                            </div>

                            <button class="btn btn-sm btn-block btn-outline-info" id="addTodoBtn">Add Todo</button>
                            <button type="button" class="btn btn-sm btn-block btn-outline-info d-none"
                                id="updateTodoBtn">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center text-white bg-info">
                        <h3>Your Todos</h3>
                    </div>

                    <div class="card-body">
                        <ul class="list-group" id="todoContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <strong>Html</strong>
                                <div>
                                    <button class="btn btn-sm btn-outline-info">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger">Remove</button>
                                </div>
                            </li> -->
                            
                        </ul>
                    </div>
                </div>

            </div>

        </div>
    </div>





    <div id="spinner" class="d-none">
        <button class="btn btn-primary" type="button" disabled>
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Loading...
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
